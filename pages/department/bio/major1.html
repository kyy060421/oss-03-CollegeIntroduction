      <p>나노기술(NT)과 생명공학(BT)을 융합하여 정밀 의료 진단 바이오센서, 나노의약품, 생체재료를 연구·개발하는 융합 공학 전공입니다.</p>
    </section>

      <ul>
        <li>나노바이오 소재 및 생체모방 공학</li>
        <li>체외진단(IVD) 바이오센서 및 랩온어칩</li>
        <li>단백질 공학 및 바이오 의약품 공정</li>
      </ul>
    </section>

    <section>
      <h2>졸업 후 진로</h2>
      <ul>
        <li>바이오의약품(CDMO) 및 정밀의료·진단기기 기업</li>
        <li>나노소재·화장품·헬스케어 연구개발직</li>
        <li>정부출연연구소 및 융합바이오 대학원 진학</li>
      </ul>
